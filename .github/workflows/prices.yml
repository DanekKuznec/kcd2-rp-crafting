name: Цены с аукциона KCDRP

on:
  schedule:
    - cron: "17 * * * *"   # каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать ответ API
        run: |
          curl -fsS -m 30 -A "kcd2-rp-crafting price sync (github.com/DanekKuznec/kcd2-rp-crafting)" \
            "https://account.kcdroleplay.com/api/ucp/realm?world=ru" -o realm.json
      - name: Оставить только аукцион
        run: |
          python3 - <<'PY'
          import json, datetime
          d = json.load(open("realm.json"))
          out = {"updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "auction": {"items": d["auction"]["items"]}}
          assert out["auction"]["items"], "пустой аукцион"
          json.dump(out, open("auction.json", "w"), ensure_ascii=False, separators=(",", ":"))
          PY
      - name: Выложить в ветку prices
        run: |
          mkdir pub && mv auction.json pub/ && cd pub
          git init -q -b prices
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add auction.json
          git commit -qm "Цены аукциона $(date -u +%F\ %H:%M) UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
