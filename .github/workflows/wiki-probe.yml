name: Проверка изменений рецептов по официальной вики
on:
  pull_request:
    paths:
      - 'tools/sync_wiki_recipes.py'
      - '.github/workflows/wiki-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Сверка без сохранения изменений
        run: python tools/sync_wiki_recipes.py
      - name: Проверка существующих тестов
        run: node --test tests/*.test.js
