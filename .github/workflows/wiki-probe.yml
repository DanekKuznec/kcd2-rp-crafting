name: Проверка синхронизации каталога рецептов KCDRP
on:
  pull_request:
    paths:
      - 'tools/wiki_probe.py'
      - 'tools/sync_wiki_recipes.py'
      - '.github/workflows/wiki-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Сверить существующие ресурсы кузнецов
        run: python tools/wiki_probe.py | grep -E 'MAT_KEYS|RAW_KEYS|WA_SAMPLES'
      - name: Проверить каталог и подготовить синхронизацию
        run: python tools/sync_wiki_recipes.py --apply
      - name: Проверить все расчёты и существующие тесты
        run: node --test tests/*.test.js
      - name: Показать размер изменений
        run: git diff --stat
