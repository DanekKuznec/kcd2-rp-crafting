name: Проверка JavaScript и склада
on:
  pull_request:
    paths:
      - '**/*.js'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить синтаксис
        run: |
          node --check app.js
          node --check sklad.js
          node --check layout.js
          node --check stock-ops.js
          node --check warehouse-payment.js
          node --check gorder-actions.js
      - name: Тесты склада
        run: node --test tests/*.test.js
